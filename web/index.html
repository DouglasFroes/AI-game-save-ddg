<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#06070f" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="description"
      content="Fliper: mais de 60 jogos grátis para jogar no celular — Stack, 2048, Block Blast, Sudoku, Jogo do Milhão, Paciência, Salve o Doguinho e muito mais, com ranking global ao vivo."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Fliper" />
    <meta property="og:title" content="Fliper — +60 jogos grátis no celular" />
    <meta
      property="og:description"
      content="Mais de 60 jogos grátis para jogar no navegador, cada um com ranking global ao vivo. Bata o recorde dos amigos!"
    />
    <meta property="og:image" content="https://play.hubdsf.com.br/og-banner.png" />
    <meta property="og:image:secure_url" content="https://play.hubdsf.com.br/og-banner.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Fliper — +60 jogos arcade grátis com ranking global"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Fliper — +60 jogos grátis no celular" />
    <meta
      name="twitter:description"
      content="Mais de 60 jogos grátis para jogar no navegador, cada um com ranking global ao vivo. Bata o recorde dos amigos!"
    />
    <meta name="twitter:image" content="https://play.hubdsf.com.br/og-banner.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Fliper" />
    <title>Fliper — +60 jogos grátis no celular</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Non-blocking: the first paint must not wait for the font stylesheet. -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Sora:wght@400;700;800&display=swap"
      media="print"
      onload="this.media = 'all'"
    />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #06070f;
        overflow: hidden;
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
      }
      #game {
        position: fixed;
        inset: 0;
        touch-action: none;
      }
      #game canvas {
        touch-action: none;
        display: block;
      }
      #splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        background: radial-gradient(120% 70% at 50% 0%, #2a1466 0%, #06070f 70%);
        color: #f5f7ff;
        font:
          800 30px/1 system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
        letter-spacing: 0.04em;
        z-index: 10;
        transition: opacity 0.25s;
      }
      #splash.done {
        opacity: 0;
        pointer-events: none;
      }
      #splash i {
        width: 46px;
        height: 46px;
        border-radius: 50%;
        border: 4px solid rgba(139, 92, 246, 0.25);
        border-top-color: #38e1ff;
        animation: splash-spin 0.8s linear infinite;
      }
      @keyframes splash-spin {
        to {
          transform: rotate(360deg);
        }
      }
      .name-input {
        width: 520px;
        font-size: 36px;
        font-weight: 700;
        padding: 16px 20px;
        border-radius: 28px;
        border: 2px solid rgba(139, 92, 246, 0.55);
        background: rgba(6, 7, 15, 0.7);
        color: #f5f7ff;
        caret-color: #38e1ff;
        outline: none;
        text-align: center;
        font-family:
          'Sora',
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
        box-sizing: border-box;
        transition:
          border-color 0.2s,
          box-shadow 0.2s;
      }
      .name-input::placeholder {
        color: #7a80a8;
        font-weight: 400;
      }
      .name-input:focus {
        border-color: #38e1ff;
        box-shadow: 0 0 0 4px rgba(56, 225, 255, 0.18);
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="splash"><span>FLIPER</span><i></i></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
