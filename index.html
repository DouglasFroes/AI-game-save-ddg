<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#7cc8ff" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="description" content="Desenhe barreiras para salvar o doguinho das abelhas!" />
    <title>Salve o Doguinho</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #1d2b53;
        overflow: hidden;
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      }
      #game {
        position: fixed;
        inset: 0;
        touch-action: none;
      }
      #game canvas {
        touch-action: none;
        display: block;
      }
      .name-input {
        width: 440px;
        font-size: 36px;
        padding: 14px 20px;
        border-radius: 18px;
        border: 4px solid #1d2b53;
        outline: none;
        text-align: center;
        font-family: inherit;
        box-sizing: border-box;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
