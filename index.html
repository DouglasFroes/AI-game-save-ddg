<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#7cc8ff" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="description"
      content="Fliperama: 30 jogos grátis para jogar no celular — Jogo do Milhão, Paciência, Última Carta, Território, Bolha Gulosa, Salve o Doguinho, Block Blast, Sudoku e muito mais, com ranking global."
    />
    <meta property="og:title" content="Fliperama — jogos grátis no celular" />
    <meta
      property="og:description"
      content="30 jogos para jogar no navegador, cada um com ranking global. Bata o recorde dos amigos!"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Fliperama" />
    <title>Fliperama — jogos grátis no celular</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Sora:wght@400;700;800&display=swap"
    />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #1d2b53;
        overflow: hidden;
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
      }
      #game {
        position: fixed;
        inset: 0;
        touch-action: none;
      }
      #game canvas {
        touch-action: none;
        display: block;
      }
      .name-input {
        width: 520px;
        font-size: 36px;
        font-weight: 700;
        padding: 16px 20px;
        border-radius: 28px;
        border: 2px solid rgba(139, 92, 246, 0.55);
        background: rgba(6, 7, 15, 0.7);
        color: #f5f7ff;
        caret-color: #38e1ff;
        outline: none;
        text-align: center;
        font-family:
          'Sora',
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
        box-sizing: border-box;
        transition:
          border-color 0.2s,
          box-shadow 0.2s;
      }
      .name-input::placeholder {
        color: #7a80a8;
        font-weight: 400;
      }
      .name-input:focus {
        border-color: #38e1ff;
        box-shadow: 0 0 0 4px rgba(56, 225, 255, 0.18);
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
